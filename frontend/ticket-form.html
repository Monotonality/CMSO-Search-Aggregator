<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ticket investigation form</title>
    <link rel="stylesheet" href="/static/ticket-form.css?v=2" />
  </head>
  <body>
    <header class="tf-header">
      <h1>Ticket investigation form</h1>
      <p>Fill in each field below. Copy or download as a text file when done.</p>
    </header>

    <form id="ticket-form" class="tf-form" onsubmit="return false"></form>

    <footer class="tf-actions">
      <button type="button" id="tf-copy" class="tf-btn tf-btn-primary">Copy to clipboard</button>
      <button type="button" id="tf-download" class="tf-btn tf-btn-secondary">
        Download .txt
      </button>
      <button type="button" id="tf-close" class="tf-btn tf-btn-ghost">Close</button>
      <p id="tf-status" class="tf-status" aria-live="polite"></p>
    </footer>

    <script src="/static/ticket-form.js?v=2"></script>
  </body>
</html>
